name: CI

on:
  push:
    branches: [master, port]
  pull_request:
    branches: [master, port]
  workflow_dispatch:

jobs:
  windows-msvc-x86:
    name: Windows MSVC x86 (CMake + oracle)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x86 dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure (CMake, Ninja, Release)
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Inspect build outputs
        shell: cmd
        run: dir /s /b build\bin

      - name: Run oracle (writes hashes.txt + PNGs to oracle-run)
        shell: cmd
        # oracle.exe writes its outputs to the CWD. Run from oracle-run so
        # the CI artifact upload has a stable path. voxlap.dll sits next
        # to oracle.exe in build/bin, so PATH lookup finds it via CWD.
        working-directory: build\oracle-run
        run: ..\bin\oracle.exe

      - name: Diff hashes against golden
        shell: bash
        run: |
          if [ -f tests/oracle/golden-hashes.txt ]; then
            echo "Comparing against frozen golden-hashes.txt:"
            diff -u tests/oracle/golden-hashes.txt build/oracle-run/hashes.txt
          else
            echo "No tests/oracle/golden-hashes.txt yet — this run establishes the baseline."
            cat build/oracle-run/hashes.txt
          fi

      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-windows-msvc-x86
          path: |
            build/oracle-run/hashes.txt
            build/oracle-run/*.png

  windows-msvc-x86-scalar-grouscan:
    # Stage 4.5b.6 shakedown: same build as the primary Windows job, but with
    # -DVOXLAP_SCALAR_GROUSCAN=ON so voxlap uses the scalar C port of
    # grouscanasm instead of the MMX routine in v5.asm. Goldens are still
    # frozen against the asm path, so a hash diff here is expected until the
    # scalar port is proven pixel-identical (or goldens get refrozen). Job is
    # non-fatal — the asm job above stays the gate; this one exists to surface
    # the diff + upload PNGs for visual comparison.
    name: Windows MSVC x86 scalar grouscan (flag ON, non-fatal)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x86 dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure (CMake, Ninja, Release, VOXLAP_SCALAR_GROUSCAN=ON)
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOXLAP_SCALAR_GROUSCAN=ON

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Run oracle (writes hashes.txt + PNGs to oracle-run)
        shell: cmd
        working-directory: build\oracle-run
        run: ..\bin\oracle.exe

      - name: Show scalar hashes + diff against asm-frozen golden
        shell: bash
        # Non-fatal diff — drift is expected while the scalar port is being
        # shaken down. `|| true` keeps the step green so the artifact upload
        # below still runs and the PNGs are available for visual inspection.
        run: |
          echo "Scalar grouscan hashes:"
          cat build/oracle-run/hashes.txt
          echo ""
          echo "Diff vs asm-frozen golden-hashes.txt (drift expected during 4.5b shakedown):"
          diff -u tests/oracle/golden-hashes.txt build/oracle-run/hashes.txt || true

      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-windows-msvc-x86-scalar-grouscan
          path: |
            build/oracle-run/hashes.txt
            build/oracle-run/*.png

  windows-msvc-x86-scalar-grouscan-debug:
    # Stage 4.5b.6g one-shot diagnostic: scalar build +
    # VOXLAP_SCALAR_GROUSCAN_DEBUG=ON so grouscanasm_scalar emits stderr
    # traces for slabs with v[1]==178 (the yellow voxel sphere's top z).
    # Runs the oracle, tees stderr into a log file, uploads the log as
    # an artifact. Non-fatal; exists purely to capture per-event state
    # so we can diagnose the speckle/dark-column artifact above the
    # sphere in diag_down / sprite_iso. Remove this job once the bug is
    # fixed.
    name: Scalar grouscan DEBUG trace (diagnostic only)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x86 dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure (CMake, Ninja, Release, SCALAR + DEBUG flag)
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOXLAP_SCALAR_GROUSCAN_DEBUG=ON

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Run oracle, capture stderr
        shell: cmd
        working-directory: build\oracle-run
        # Tee stderr to a file so the artifact upload picks it up even
        # if the run fails.
        run: ..\bin\oracle.exe 2> grouscan-debug.log

      - name: Show trace head
        if: always()
        shell: bash
        run: |
          echo "First 200 lines of grouscan-debug.log:"
          head -n 200 build/oracle-run/grouscan-debug.log || true
          echo ""
          echo "Total lines: $(wc -l < build/oracle-run/grouscan-debug.log)"

      - name: Upload debug trace + oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-windows-msvc-x86-scalar-grouscan-debug
          path: |
            build/oracle-run/grouscan-debug.log
            build/oracle-run/hashes.txt
            build/oracle-run/*.png

  linux-gcc:
    name: Linux GCC (CMake configure + build, expected fail at link)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: gcc --version
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc
      - name: Build
        # Expected to fail until Stage 3 replaces the MSVC inline asm in
        # voxlap5.c and Stage 4 replaces v5.asm / voxasm. Left non-fatal
        # via continue-on-error on the job so we can watch it go green
        # as the port progresses.
        run: cmake --build build

  linux-clang:
    name: Linux Clang (CMake configure + build, expected fail at link)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: clang --version
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build

  macos-clang:
    name: macOS Clang (CMake configure + build, expected fail at link)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: clang --version
      - name: Install Ninja
        run: brew install ninja
      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
