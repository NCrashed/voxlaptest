name: CI

on:
  push:
    branches: [master, port]
  pull_request:
    branches: [master, port]
  workflow_dispatch:

jobs:
  windows-msvc-x86:
    name: Windows MSVC x86 (oracle build + run)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC x86 dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build voxlap.dll (Release | Win32)
        shell: cmd
        run: >
          msbuild voxlap\voxlap.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /m

      - name: Locate build outputs
        shell: cmd
        run: dir /s /b voxlap\*.dll voxlap\*.lib voxasm\*.lib

      - name: Build oracle.exe
        shell: cmd
        # /MT matches voxlap.dll's RuntimeLibrary=MultiThreaded (static CRT).
        # /J matches the DLL's unsigned-char default so char compares agree.
        run: >
          cl /nologo /O2 /MT /J /W3 /I voxlap
          /Fe:tests\oracle\oracle.exe
          /Fo:tests\oracle\oracle.obj
          tests\oracle\oracle.c
          voxlap\Release\voxlap.lib

      - name: Stage oracle runtime deps
        shell: cmd
        run: copy /y voxlap\Release\voxlap.dll tests\oracle\voxlap.dll

      - name: Run oracle (produces hashes.txt + PNGs)
        shell: cmd
        working-directory: tests\oracle
        run: oracle.exe

      - name: Diff hashes against golden (if committed)
        shell: bash
        run: |
          if [ -f tests/oracle/golden-hashes.txt ]; then
            echo "Comparing against frozen golden-hashes.txt:"
            diff -u tests/oracle/golden-hashes.txt tests/oracle/hashes.txt
          else
            echo "No tests/oracle/golden-hashes.txt yet — this run establishes the baseline."
            cat tests/oracle/hashes.txt
          fi

      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-windows-msvc-x86
          path: |
            tests/oracle/hashes.txt
            tests/oracle/*.png

  linux-gcc:
    name: Linux GCC (placeholder — port lands in Stage 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: gcc --version
      - name: Report port status
        run: echo "Linux GCC build arrives with CMake in Stage 1 of PORTING.md."

  linux-clang:
    name: Linux Clang (placeholder — port lands in Stage 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: clang --version
      - name: Report port status
        run: echo "Linux Clang build arrives with CMake in Stage 1 of PORTING.md."

  macos-clang:
    name: macOS Clang (placeholder — port lands in Stage 1)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: clang --version
      - name: Report port status
        run: echo "macOS Clang build arrives with CMake in Stage 1 of PORTING.md."
